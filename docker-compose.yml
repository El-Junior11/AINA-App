services:

  backend:
    build: ./backend
    ports:
      - "5004:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: asus
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tsinjo_db
      JWT_SECRET: tsinjo_secret_key_2026

  frontend:
    build: ./frontend
    container_name: aina-frontend-1
    ports:
      - "5275:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tsinjo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: