apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tsinjo-aina-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: tsinjoaina.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
              
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80