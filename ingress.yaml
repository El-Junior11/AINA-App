apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tsinjo-aina-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: tsinjoaina.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aina-app-service
                port:
                  number: 80
